# Builds the zip for players: the folder inside is RedGuildForever, like the .toc file.
# The "Download ZIP" button of GitHub names the folder after the branch, which the
# game and CurseForge do not accept.
#   Push a tag like v2.0.1  -> tests, builds and attaches RedGuildForever.zip to a GitHub release
#   Run it by hand          -> tests and builds, the zip is under the run's artifacts
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and zip
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip

      - name: Run the tests and build the zip
        run: ./build.sh

      - name: Keep the zip with the run
        uses: actions/upload-artifact@v4
        with:
          name: RedGuildForever
          path: dist/RedGuildForever.zip

      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the notes are the changelog entry of this version
          awk -v v="## $version " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/RedGuildForever.zip \
            --title "Red Guild EPGP $version" --notes-file notes.md
